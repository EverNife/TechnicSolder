server {
    listen 80;
    listen [::]:80;

    server_name phpfpm.local;

    access_log      /var/log/nginx/access.log;
    error_log       /var/log/nginx/error.log;
    rewrite_log     on;

    root /var/www/html/public;
    index index.php;

    # A literal fastcgi_pass host is resolved once at startup, so a restarted php-fpm container
    # with a new IP leaves nginx answering 502. A variable forces lookups through Docker's DNS.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_fpm solder:9000;

    # Mod archives are uploaded through PHP; Laravel validation enforces the real 100 MB cap.
    client_max_body_size 112m;

    # Mod archives live outside the application tree so a redeploy cannot clear them.
    location /mods/ {
        alias /var/www/mods/;
    }

    location / {
        try_files   $uri $uri/ /index.php?$query_string;
    }
    
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass $php_fpm;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}